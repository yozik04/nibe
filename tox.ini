[tox]
envlist =
    py311
    py312
    py313
isolated_build = True
skip_missing_interpreters = True

[testenv]
changedir = tests
deps =
    .[convert,cli]
    pytest
    pytest-asyncio
    syrupy==4.9.1; python_version < "3.10"
    syrupy==6.1.1; python_version >= "3.10"
commands = pytest --basetemp="{envtmpdir}"  {posargs}
